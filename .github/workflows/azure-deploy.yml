# ─────────────────────────────────────────────────────────────────────────────
#  PixoGram CI/CD Pipeline
#  Trigger: push to main → test → build Docker image → deploy to Azure App Service
# ─────────────────────────────────────────────────────────────────────────────
name: Build and Deploy to Azure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # ── Change these three values to match your Azure resources ──
  AZURE_WEBAPP_NAME: pixogram-api          # Your App Service name
  ACR_NAME: pixogramacr                    # Your Azure Container Registry name
  IMAGE_NAME: pixogram-api

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  #  JOB 1: Run tests
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run tests
        working-directory: ./backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci
          JWT_EXPIRY: 1h

  # ────────────────────────────────────────────────────────────────────────────
  #  JOB 2: Build Docker image and push to Azure Container Registry
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'   # only on main branch, not PRs

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Generate image tag (short SHA)
        id: meta
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        working-directory: ./backend
        run: |
          IMAGE=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          TAG=${{ steps.meta.outputs.version }}

          docker build -t $IMAGE:$TAG -t $IMAGE:latest .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

  # ────────────────────────────────────────────────────────────────────────────
  #  JOB 3: Deploy to Azure App Service
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    environment: production       # enables manual approval gate (optional)

    steps:
      - name: Log in to Azure CLI
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}

      - name: Set App Service environment variables (JWT config)
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              { "name": "NODE_ENV",       "value": "production",  "slotSetting": false },
              { "name": "PORT",           "value": "3000",        "slotSetting": false },
              { "name": "JWT_SECRET",     "value": "${{ secrets.JWT_SECRET }}", "slotSetting": false },
              { "name": "JWT_EXPIRY",     "value": "1h",          "slotSetting": false },
              { "name": "COSMOS_ENDPOINT","value": "${{ secrets.COSMOS_ENDPOINT }}", "slotSetting": false },
              { "name": "COSMOS_KEY",     "value": "${{ secrets.COSMOS_KEY }}",      "slotSetting": false },
              { "name": "COSMOS_DATABASE","value": "PixoGram",    "slotSetting": false },
              { "name": "REDIS_HOST",     "value": "${{ secrets.REDIS_HOST }}",      "slotSetting": false },
              { "name": "REDIS_PORT",     "value": "6380",        "slotSetting": false },
              { "name": "REDIS_PASSWORD", "value": "${{ secrets.REDIS_PASSWORD }}", "slotSetting": false },
              { "name": "REDIS_SSL",      "value": "true",        "slotSetting": false },
              { "name": "STORAGE_CONNECTION_STRING", "value": "${{ secrets.STORAGE_CONNECTION_STRING }}", "slotSetting": false },
              { "name": "STORAGE_CONTAINER_NAME",    "value": "photos",      "slotSetting": false },
              { "name": "STORAGE_THUMBNAIL_CONTAINER","value": "thumbnails", "slotSetting": false },
              { "name": "VISION_ENDPOINT","value": "${{ secrets.VISION_ENDPOINT }}", "slotSetting": false },
              { "name": "VISION_KEY",     "value": "${{ secrets.VISION_KEY }}",      "slotSetting": false },
              { "name": "ALLOWED_ORIGINS","value": "${{ secrets.ALLOWED_ORIGINS }}", "slotSetting": false }
            ]

      - name: Verify deployment health check
        run: |
          sleep 20
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health)
          echo "Health check status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check failed!"
            exit 1
          fi
          echo "Deployment successful!"
